name: 🐛 Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, query, or command that triggers it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment / context
      description: Repo, branch, run link, dbt/Airflow/warehouse version, anything relevant.
    validations:
      required: false
